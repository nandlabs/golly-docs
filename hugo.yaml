# Hugo configuration file
baseURL: "https://golly.nandlabs.io"
title: Golly


outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

defaultContentLanguage: en
languages:
  en:
    languageName: English
    weight: 1
    title: Golly

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/nandlabs/golly"
      params:
        icon: github
  
params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/golly-logo.png
      dark: images/golly-logo.png
      width: 100
      height: 100

  versioning:
    enable: true
    current: "v1.4.0"
    versions:
      - label: "v1.4.0 (latest)"
        url: "/"
        current: true
      # To add older versions, deploy them to a subdirectory and add entries:
      - label: "v1.3.0"
        url: "/v1.3.0/"
        current: false
      - label: "v1.2.9"
        url: "/v1.2.9/"
        current: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/nandlabs/golly-docs/edit/main/content"