{{- /* Version Selector - injected via Hextra custom/head-end hook */ -}}
{{- with .Site.Params.versioning -}}
{{- if .enable -}}
<script id="version-config" type="application/json">
{"current":"{{ .current }}","versions":[{{ range $i, $v := .versions }}{{ if $i }},{{ end }}{"label":"{{ $v.label }}","url":"{{ $v.url }}","current":{{ if $v.current }}true{{ else }}false{{ end }}}{{ end }}]}
</script>
<script src="{{ " js/version-selector.js" | relURL }}"></script>
{{- end -}}
{{- end -}}

{{- /* Parallax scroll-reveal for home page sections */ -}}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var targets = document.querySelectorAll('.category-section, .why-golly-section');
        if (!targets.length) return;
        targets.forEach(function (el) { el.classList.add('scroll-reveal'); });
        if ('IntersectionObserver' in window) {
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('revealed');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
            targets.forEach(function (el) { observer.observe(el); });
        } else {
            targets.forEach(function (el) { el.classList.add('revealed'); });
        }
    });
</script>
